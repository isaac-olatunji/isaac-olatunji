<svg viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D1F3C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8C97A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F4E79"/>
      <stop offset="100%" stop-color="#5B9BD5"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1E3A5F" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="400" fill="url(#gold)"/>

  <!-- Right accent bar -->
  <rect x="1594" y="0" width="6" height="400" fill="url(#blue)"/>

  <!-- Gold accent line — centered -->
  <rect x="620" y="58" width="360" height="3" fill="url(#gold)"/>

  <!-- Eyebrow — centered, larger and legible -->
  <text x="800" y="48" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="16"
        fill="#C9A84C" letter-spacing="4">BUSINESS INTELLIGENCE ANALYST</text>

  <!-- Main name — centered -->
  <text x="800" y="158" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="80" font-weight="700" fill="#F4F6FA">Isaac Olatunji</text>

  <!-- Tool tagline — centered -->
  <text x="800" y="204" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22" fill="#8DA3C4" letter-spacing="1">Power BI  ·  SQL  ·  Data Engineering  ·  Business Storytelling</text>

  <!-- Thin divider — centered -->
  <rect x="480" y="226" width="640" height="1" fill="#2A4A6A"/>

  <!-- Quote — centered -->
  <text x="800" y="258" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="#6B85AC" font-style="italic">"The goal is not to have more data. The goal is to have better decisions."</text>

  <!-- Bottom tool strip — centered -->
  <rect x="370" y="306" width="860" height="1" fill="#1E3A5F"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="440"  y="332" font-size="20" font-weight="700" fill="#5B9BD5">Power BI</text>
    <text x="440"  y="350" font-size="11" fill="#4A6184" letter-spacing="1">DASHBOARDS</text>

    <text x="600" y="332" font-size="20" font-weight="700" fill="#5B9BD5">MySQL</text>
    <text x="600" y="350" font-size="11" fill="#4A6184" letter-spacing="1">DATA ENGINEERING</text>

    <text x="760" y="332" font-size="20" font-weight="700" fill="#5B9BD5">DAX</text>
    <text x="760" y="350" font-size="11" fill="#4A6184" letter-spacing="1">MEASURES</text>

    <text x="880" y="332" font-size="20" font-weight="700" fill="#5B9BD5">SQL</text>
    <text x="880" y="350" font-size="11" fill="#4A6184" letter-spacing="1">ANALYTICS</text>

    <text x="1010" y="332" font-size="20" font-weight="700" fill="#C9A84C">Python</text>
    <text x="1010" y="350" font-size="11" fill="#4A6184" letter-spacing="1">IN PROGRESS</text>
  </g>

  <!-- GitHub handle — bottom right -->
  <text x="1540" y="382" font-family="'Courier New', monospace" font-size="13"
        fill="#4A6184" text-anchor="end">github.com/isaac-olatunji</text>
</svg>
